    <rect x="48" y="890" width="116" height="136" rx="14" fill="#40543f"/><rect x="175" y="890" width="116" height="136" rx="14" fill="#6e4a30"/><rect x="302" y="890" width="116" height="136" rx="14" fill="#6e4a30"/><rect x="429" y="890" width="116" height="136" rx="14" fill="#40543f"/><rect x="556" y="890" width="116" height="136" rx="14" fill="#6e4a30"/>
  </g>
  <text x="52" y="582" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" fill="#ffe0a3" font-size="13">前排 · 火力与维修</text>

  <!-- 格内内容 -->
  <g filter="url(#shadow)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <g transform="translate(106 658)"><rect x="-27" y="-15" width="54" height="35" rx="8" fill="#444d4b"/><path d="M-10-15l4-46h9l3 46m8 0 5-46h9l3 46" stroke="#f6c453" stroke-width="7" stroke-linecap="round"/><text y="48" fill="#f3e9d7" font-size="12">机枪塔</text></g>
    <g transform="translate(233 658)"><rect x="-30" y="-17" width="60" height="37" rx="8" fill="#454a48"/><path d="M-11-15l6-50H10l7 50" fill="#ff7043"/><text y="48" fill="#f3e9d7" font-size="12">火炮塔</text></g>
    <g transform="translate(487 658)"><rect x="-28" y="-16" width="56" height="36" rx="8" fill="#42464e"/><path d="M-19-50l14 26m24-26L5-24M-19-50l7-15m31 15l-7-15" stroke="#b28dff" stroke-width="7"/><text y="48" fill="#f3e9d7" font-size="12">电磁塔</text></g>
