    <circle cx="155" cy="480" r="13" fill="#ffb547"/><circle cx="565" cy="480" r="13" fill="#ffb547"/>
  </g>

  <!-- 围墙内 5×3 建筑庭院 -->
  <path d="M34 558H686V1088H34Z" fill="url(#yard)" stroke="#a77a4d" stroke-width="5"/>
  <path d="M34 558v530M686 558v530" stroke="#d49d64" stroke-opacity="0.42" stroke-width="14"/>
  <g stroke="#9a6c45" stroke-width="3">
    <rect x="48" y="590" width="116" height="136" rx="14" fill="#40543f"/><rect x="175" y="590" width="116" height="136" rx="14" fill="#40543f"/><rect x="302" y="590" width="116" height="136" rx="14" fill="#6e4a30"/><rect x="429" y="590" width="116" height="136" rx="14" fill="#40543f"/><rect x="556" y="590" width="116" height="136" rx="14" fill="#6e4a30"/>
