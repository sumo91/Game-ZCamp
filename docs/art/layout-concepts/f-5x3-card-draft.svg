    <g transform="translate(455 390) scale(.82)"><circle cy="-12" r="11" fill="#71864a"/><path d="M-15 29l5-33h20l7 33z" fill="#637340"/></g>
  </g>
  <path d="M150 750Q230 620 346 400" fill="none" stroke="#f6c453" stroke-width="4"/>
  <path d="M570 750Q515 610 458 391" fill="none" stroke="#b28dff" stroke-width="5"/>
  <circle cx="455" cy="390" r="20" fill="none" stroke="#b28dff" stroke-width="4"/>

