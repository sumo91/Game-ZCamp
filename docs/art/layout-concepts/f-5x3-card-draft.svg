    <path d="M48 458v-34h58v34m26 0v-34h58v34m26 0v-34h58v34m172 0v-34h58v34m26 0v-34h58v34m26 0v-34h58v34" fill="#74665a" stroke="#b58a59" stroke-width="5"/>
