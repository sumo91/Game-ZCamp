<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <title>ZCamp 方案 F：5×3 三卡建造</title>
  <desc>上方尸潮大场面、中央城墙、下方五列三行建筑区，底部每次显示三张建造选择卡。</desc>
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#09202a"/><stop offset="0.5" stop-color="#245047"/><stop offset="1" stop-color="#463a28"/></linearGradient>
    <linearGradient id="yard" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#865d35"/><stop offset="1" stop-color="#5d4029"/></linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#61b9e6"/><stop offset="1" stop-color="#286ca4"/></linearGradient>
    <linearGradient id="cardGreen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8bcf5d"/><stop offset="1" stop-color="#3f8c46"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.48"/></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="13"/></filter>
    <pattern id="grass" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M8 32l4-9m1 9l5-7M34 15l3-7m1 7l5-5" stroke="#7aa467" stroke-width="2" opacity="0.18"/></pattern>
  </defs>
  <rect width="720" height="1280" rx="34" fill="url(#forest)"/>
  <rect width="720" height="1280" rx="34" fill="url(#grass)"/>

  <!-- 左资源、右波次 -->
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" filter="url(#shadow)">
    <g transform="translate(22 24)"><rect width="174" height="60" rx="19" fill="#07141d" fill-opacity="0.9"/><path d="M27 10l15 8-3 29-24 2-6-27z" fill="#c98a4a"/><text x="58" y="41" fill="#f3e9d7" font-size="27" font-weight="800">150</text></g>
    <g transform="translate(22 94)"><rect width="174" height="60" rx="19" fill="#07141d" fill-opacity="0.9"/><circle cx="29" cy="30" r="17" fill="#ffd166" stroke="#ffe9a6" stroke-width="3"/><text x="58" y="41" fill="#f3e9d7" font-size="27" font-weight="800">320</text></g>
    <g transform="translate(466 24)"><rect width="232" height="104" rx="22" fill="#111c2a" fill-opacity="0.94" stroke="#798899" stroke-width="3"/><text x="116" y="39" text-anchor="middle" fill="#f3e9d7" font-size="24" font-weight="800">第 3 / 20 波</text><path d="M26 72h180" stroke="#342f3a" stroke-width="18" stroke-linecap="round"/><path d="M26 72h74" stroke="#ff7043" stroke-width="18" stroke-linecap="round"/></g>
  </g>

  <!-- 宽阔尸潮区 -->
  <g stroke="#d8dfc5" stroke-width="2">
    <g transform="translate(300 180) scale(.72)"><circle cy="-12" r="11" fill="#71864a"/><path d="M-15 29l5-33h20l7 33z" fill="#637340"/></g>
    <g transform="translate(365 196) scale(.75)"><circle cy="-12" r="11" fill="#71864a"/><path d="M-15 29l5-33h20l7 33z" fill="#637340"/></g>
    <g transform="translate(430 176) scale(.7)"><circle cy="-12" r="11" fill="#71864a"/><path d="M-15 29l5-33h20l7 33z" fill="#637340"/></g>
    <g transform="translate(262 235) scale(1.05)"><circle cy="-12" r="12" fill="#71864a"/><path d="M-20 31l6-36h29l8 36z" fill="#58663e"/></g>
    <g transform="translate(340 255) scale(.8)"><circle cy="-12" r="11" fill="#71864a"/><path d="M-15 29l5-33h20l7 33z" fill="#637340"/></g>
    <g transform="translate(410 245) scale(.78)"><circle cy="-12" r="11" fill="#a8d94c"/><path d="M-15 29l5-33h20l7 33z" fill="#71864a"/></g>
