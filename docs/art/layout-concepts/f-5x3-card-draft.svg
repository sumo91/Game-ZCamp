    <g transform="translate(360 808)"><path d="M-35 22v-44h70v44z" fill="#566159"/><path d="M-43-22L0-54 43-22" fill="#32443d"/><path d="M-20-5h40" stroke="#ffb547" stroke-width="6"/><text y="49" fill="#f3e9d7" font-size="12">修理所</text></g>
    <g transform="translate(614 808)"><path d="M-34 20v-42l34-28 34 28v42z" fill="#4d5c55" stroke="#ffb547" stroke-width="3"/><rect x="-10" y="-5" width="20" height="23" fill="#ffd37c"/><text y="49" fill="#f3e9d7" font-size="12">主城</text></g>
    <g transform="translate(106 958)"><circle cy="-18" r="27" fill="#74a94e"/><circle cx="-21" cy="-7" r="19" fill="#84ba58"/><circle cx="21" cy="-7" r="19" fill="#7caf52"/><rect x="-9" y="4" width="18" height="27" fill="#9b683d"/><text y="49" fill="#f3e9d7" font-size="12">伐木场</text></g>
    <g transform="translate(487 958)"><rect x="-28" y="-18" width="56" height="38" rx="8" fill="#3d4b46"/><path d="M0-66l22 35L0-9l-22-22z" fill="#55c7e8"/><text y="49" fill="#f3e9d7" font-size="12">冰冻塔</text></g>
  </g>
  <g stroke="#c0966b" stroke-width="3" stroke-linecap="round"><path d="M348 658h24M360 646v24"/><path d="M602 958h24M614 946v24"/><path d="M221 958h24M233 946v24"/><path d="M348 958h24M360 946v24"/></g>

  <!-- 三卡建造区：部分覆盖庭院下沿 -->
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(34 1048) rotate(-3 102 108)"><rect width="204" height="214" rx="22" fill="url(#cardGreen)" stroke="#bfe89f" stroke-width="4"/><text x="102" y="34" fill="#f7fff1" font-size="20" font-weight="800">伐木场</text><circle cx="102" cy="98" r="43" fill="#3e7c42"/><circle cx="102" cy="88" r="35" fill="#8bd05f"/><rect x="94" y="112" width="16" height="31" fill="#8d5b34"/><text x="102" y="184" fill="#fff4c8" font-size="22" font-weight="800">木材 50</text></g>
    <g transform="translate(258 1034)"><rect width="204" height="228" rx="22" fill="url(#cardBlue)" stroke="#bcecff" stroke-width="5"/><text x="102" y="38" fill="#f4fbff" font-size="20" font-weight="800">火炮塔</text><circle cx="102" cy="108" r="48" fill="#295f86"/><rect x="71" y="107" width="62" height="38" rx="9" fill="#464a48"/><path d="M90 110l7-55h15l8 55" fill="#ff7043"/><text x="102" y="198" fill="#fff4c8" font-size="22" font-weight="800">木材 65</text></g>
