<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <title>ZCamp 主战场方案 B：战场格位优先</title>
  <desc>参考 Lucky Defense 的战场占比、有限格位和集中底部操作。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#07131d"/>
      <stop offset="0.58" stop-color="#173039"/>
      <stop offset="1" stop-color="#243a35"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#23343b"/>
      <stop offset="0.5" stop-color="#46585a"/>
      <stop offset="1" stop-color="#23343b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1d2c38"/>
      <stop offset="1" stop-color="#0c1722"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity="0.42"/></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="11"/></filter>
    <pattern id="speck" width="42" height="42" patternUnits="userSpaceOnUse"><circle cx="8" cy="12" r="2" fill="#93a4a3" opacity="0.08"/><circle cx="31" cy="33" r="1.5" fill="#93a4a3" opacity="0.06"/></pattern>
  </defs>
  <rect width="720" height="1280" rx="34" fill="url(#night)"/>
  <rect width="720" height="1280" rx="34" fill="url(#speck)"/>

  <!-- 顶部简洁状态区 -->
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <rect x="20" y="20" width="680" height="84" rx="22" fill="#0b1721" stroke="#50636a" stroke-opacity="0.42"/>
    <g transform="translate(38 34)">
      <rect width="140" height="52" rx="17" fill="#172832"/>
      <path d="M22 10l12 7-2 22-20 2-4-20z" fill="#c98a4a" stroke="#f2c17e" stroke-width="2"/>
      <text x="48" y="34" fill="#f3e9d7" font-size="23" font-weight="700">120</text>
    </g>
    <g transform="translate(188 34)">
      <rect width="126" height="52" rx="17" fill="#172832"/>
      <circle cx="25" cy="26" r="14" fill="#ffd166"/>
      <text x="49" y="34" fill="#f3e9d7" font-size="23" font-weight="700">35</text>
    </g>
    <text x="360" y="57" text-anchor="middle" fill="#a9b6b5" font-size="14">准备阶段</text>
    <text x="360" y="83" text-anchor="middle" fill="#f3e9d7" font-size="23" font-weight="700">第 7 / 20 波</text>
    <rect x="492" y="34" width="136" height="52" rx="17" fill="#172832"/>
    <path d="M508 60h104" stroke="#31414a" stroke-width="12" stroke-linecap="round"/>
    <path d="M508 60h78" stroke="#e9564a" stroke-width="12" stroke-linecap="round"/>
    <text x="560" y="80" text-anchor="middle" fill="#f3e9d7" font-size="12">城墙 75%</text>
    <circle cx="666" cy="60" r="23" fill="#172832"/>
    <path d="M658 48v24m15-24v24" stroke="#f3e9d7" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 主战场：格位是主角 -->
  <rect x="20" y="118" width="680" height="788" rx="28" fill="#10232c" stroke="#61747a" stroke-opacity="0.38"/>
  <path d="M295 120 C274 235 292 345 275 470 C258 595 282 720 266 902 H454 C438 720 462 595 445 470 C428 345 446 235 425 120Z" fill="url(#lane)"/>
  <path d="M307 120C287 240 305 350 289 470C273 590 297 720 282 902M413 120C433 240 415 350 431 470C447 590 423 720 438 902" fill="none" stroke="#74868a" stroke-opacity="0.32" stroke-width="3" stroke-dasharray="8 16"/>

  <!-- 敌方入口和进度 -->
  <ellipse cx="360" cy="146" rx="116" ry="54" fill="#07131d"/>
  <ellipse cx="360" cy="151" rx="68" ry="24" fill="#a8d94c" opacity="0.12" filter="url(#soft)"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="360" y="146" fill="#a9b6b5" font-size="13">下一波敌情</text>
    <text x="360" y="171" fill="#f3e9d7" font-size="18" font-weight="700">行尸 ×8 · 装甲精英 ×2</text>
  </g>

  <!-- 10 格，两列清楚排布 -->
  <g filter="url(#drop)" stroke-width="3">
    <g transform="translate(92 215)"><rect x="-58" y="-42" width="116" height="84" rx="20" fill="#213640" stroke="#6b7e82"/><circle r="29" fill="#15262f"/><path d="M-12 17L-7-18H1L3 17m5 0 4-35h8l5 35" stroke="#f6c453" stroke-width="7" stroke-linecap="round"/></g>
    <g transform="translate(628 215)"><rect x="-58" y="-42" width="116" height="84" rx="20" fill="#213640" stroke="#6b7e82"/><circle r="29" fill="#15262f"/><path d="M-15 19l8-38H9l9 38" fill="#ff7043"/></g>
    <g transform="translate(92 365)"><rect x="-58" y="-42" width="116" height="84" rx="20" fill="#213640" stroke="#55c7e8"/><circle r="29" fill="#15262f"/><path d="M0-26l20 29L0 24-20 3z" fill="#55c7e8"/></g>
    <g transform="translate(628 365)"><rect x="-58" y="-42" width="116" height="84" rx="20" fill="#213640" stroke="#6b7e82"/><circle r="29" fill="#15262f"/><path d="M-20 22L-5 2l-10-6L9-27 4-7l16 5L-8 25" fill="#b28dff"/></g>
    <g transform="translate(92 515)"><rect x="-58" y="-42" width="116" height="84" rx="20" fill="#1a2b34" stroke="#566b72"/><circle r="30" fill="none" stroke="#708087" stroke-width="2" stroke-dasharray="7 6"/><path d="M-13 0H13M0-13V13" stroke="#a9b6b5" stroke-width="4" stroke-linecap="round"/></g>
    <g transform="translate(628 515)"><rect x="-58" y="-42" width="116" height="84" rx="20" fill="#1a2b34" stroke="#566b72"/><circle r="30" fill="none" stroke="#708087" stroke-width="2" stroke-dasharray="7 6"/><path d="M-13 0H13M0-13V13" stroke="#a9b6b5" stroke-width="4" stroke-linecap="round"/></g>
    <g transform="translate(92 665)"><rect x="-58" y="-42" width="116" height="84" rx="20" fill="#1a2b34" stroke="#566b72"/><circle r="30" fill="none" stroke="#708087" stroke-width="2" stroke-dasharray="7 6"/><path d="M-13 0H13M0-13V13" stroke="#a9b6b5" stroke-width="4" stroke-linecap="round"/></g>
    <g transform="translate(628 665)"><rect x="-58" y="-42" width="116" height="84" rx="20" fill="#1a2b34" stroke="#566b72"/><circle r="30" fill="none" stroke="#708087" stroke-width="2" stroke-dasharray="7 6"/><path d="M-13 0H13M0-13V13" stroke="#a9b6b5" stroke-width="4" stroke-linecap="round"/></g>
    <g transform="translate(92 815)"><rect x="-58" y="-42" width="116" height="84" rx="20" fill="#1a2b34" stroke="#566b72"/><circle r="30" fill="none" stroke="#708087" stroke-width="2" stroke-dasharray="7 6"/><path d="M-13 0H13M0-13V13" stroke="#a9b6b5" stroke-width="4" stroke-linecap="round"/></g>
    <g transform="translate(628 815)"><rect x="-58" y="-42" width="116" height="84" rx="20" fill="#1a2b34" stroke="#566b72"/><circle r="30" fill="none" stroke="#708087" stroke-width="2" stroke-dasharray="7 6"/><path d="M-13 0H13M0-13V13" stroke="#a9b6b5" stroke-width="4" stroke-linecap="round"/></g>
  </g>

  <!-- 预览尸潮 -->
  <g stroke="#d7dfc2" stroke-width="2">
    <g transform="translate(340 250)"><circle cy="-12" r="11" fill="#71864a"/><path d="M-15 29l5-33h20l7 33z" fill="#647541"/><path d="M-10 4l-18 15M10 4l19 12"/></g>
    <g transform="translate(387 290) scale(.82)"><circle cy="-12" r="11" fill="#71864a"/><path d="M-15 29l5-33h20l7 33z" fill="#647541"/><path d="M-10 4l-18 15M10 4l19 12"/></g>
    <g transform="translate(350 365) scale(1.18)"><circle cy="-12" r="12" fill="#71864a"/><path d="M-20 31l6-36h29l7 36z" fill="#59683e"/><rect x="-16" y="-1" width="32" height="12" rx="3" fill="#56656b"/></g>
    <g transform="translate(395 455) scale(.76)"><circle cy="-12" r="11" fill="#a8d94c"/><path d="M-15 29l5-33h20l7 33z" fill="#71864a"/><path d="M-10 4l-18 15M10 4l19 12"/></g>
    <g transform="translate(333 545)"><circle cy="-12" r="11" fill="#71864a"/><path d="M-15 29l5-33h20l7 33z" fill="#647541"/><path d="M-10 4l-18 15M10 4l19 12"/></g>
  </g>
  <path d="M92 205Q205 215 330 250" fill="none" stroke="#f6c453" stroke-width="4"/>
  <path d="M628 350Q510 360 405 450" fill="none" stroke="#b28dff" stroke-width="5"/>
  <circle cx="405" cy="450" r="22" fill="none" stroke="#b28dff" stroke-width="4" opacity="0.75"/>

  <!-- 墙和基地 -->
  <ellipse cx="360" cy="824" rx="170" ry="92" fill="#ffb547" opacity="0.12" filter="url(#soft)"/>
  <path d="M232 814h256v58H232z" fill="#4e5048" stroke="#a17f55" stroke-width="4"/>
  <path d="M248 814v-25h42v25m22 0v-25h42v25m52 0v-25h42v25" fill="#64645a" stroke="#a17f55" stroke-width="4"/>
  <path d="M320 900l40-42 40 42v35h-80z" fill="#35463f" stroke="#ffb547" stroke-width="4"/>
  <rect x="348" y="896" width="24" height="28" fill="#ffd780" rx="4"/>

  <!-- 底部集中操作台 -->
  <rect x="0" y="920" width="720" height="360" fill="url(#panel)"/>
  <path d="M0 920H720" stroke="#6e8186" stroke-opacity="0.42" stroke-width="2"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="28" y="960" font-size="18" fill="#a9b6b5">选择塔种，再点击空建造台</text>
    <text x="692" y="960" text-anchor="end" font-size="18" fill="#55c7e8">已选择：冰冻塔</text>
  </g>
  <g transform="translate(28 980)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <g><rect width="152" height="116" rx="18" fill="#20313c" stroke="#66787d"/><circle cx="76" cy="42" r="25" fill="#15242d"/><path d="M64 60l5-36h7l2 36m6 0 4-36h7l4 36" stroke="#f6c453" stroke-width="6"/><text x="76" y="94" fill="#f3e9d7" font-size="17">机枪 40</text></g>
    <g transform="translate(164)"><rect width="152" height="116" rx="18" fill="#20313c" stroke="#66787d"/><circle cx="76" cy="42" r="25" fill="#15242d"/><path d="M64 62l7-38h13l8 38" fill="#ff7043"/><text x="76" y="94" fill="#f3e9d7" font-size="17">火炮 65</text></g>
    <g transform="translate(328)"><rect width="152" height="116" rx="18" fill="#25414b" stroke="#55c7e8" stroke-width="4"/><circle cx="76" cy="42" r="25" fill="#15242d"/><path d="M76 16l18 27-18 20-18-20z" fill="#55c7e8"/><text x="76" y="94" fill="#f3e9d7" font-size="17" font-weight="700">冰冻 55</text></g>
    <g transform="translate(492)"><rect width="172" height="116" rx="18" fill="#20313c" stroke="#66787d"/><circle cx="86" cy="42" r="25" fill="#15242d"/><path d="M69 59l12-18-8-5 20-19-5 18 13 4-23 22" fill="#b28dff"/><text x="86" y="94" fill="#f3e9d7" font-size="17">电磁 85</text></g>
  </g>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="28" y="1112" width="210" height="72" rx="20" fill="#21333d" stroke="#61747a"/>
    <text x="133" y="1142" fill="#a9b6b5" font-size="14">防线管理</text>
    <text x="133" y="1168" fill="#f3e9d7" font-size="20" font-weight="700">升级 / 维修</text>
    <rect x="254" y="1112" width="438" height="72" rx="20" fill="#ffb547" filter="url(#drop)"/>
    <text x="473" y="1157" fill="#18201d" font-size="24" font-weight="800">开始第 8 波</text>
    <rect x="28" y="1200" width="664" height="44" rx="16" fill="#172833"/>
    <text x="360" y="1228" fill="#a9b6b5" font-size="15">本波预估压力：中等　·　木材产出 +3.5 / 秒</text>
  </g>
</svg>
